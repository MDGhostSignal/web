# Fly.io config for the GhostSignal Colyseus game server.
# Run `fly launch` from this directory the first time; it will read
# this file and provision a small shared-cpu machine in iad (Ashburn).
#
# After launch, set the production WebSocket URL on the web app:
#   vercel env add NEXT_PUBLIC_GAME_SERVER_URL production
#   # → wss://<your-app>.fly.dev

app = "ghostsignal-game-server"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "2567"
  NODE_ENV = "production"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
